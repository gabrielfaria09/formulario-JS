<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FORMULÁRIO INTERATIVO</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>FORMULÁRIO INTERATIVO</h1>

    <form>
        <label>Nome:</label>
        <input id="nome">
        <label>Email:</label>
        <input id="email" type="email">
        <label>Idade:</label>
        <input type="number" id="idade">
        <textarea rows="3" placeholder="Digite informações adicionais aqui..."></textarea>

        <button type="submit" id="button">Submeter</button>
    </form>

    <p id="error"></p>


    <script src="script.js"></script>
</body>
</html>
